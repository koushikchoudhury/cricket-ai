[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cricket-ai"
version = "0.1.0"
description = "Cricket AI portfolio: ball-by-ball analytics, win probability, synthetic data, vision, multimodal RAG and an agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Koushik Choudhury" }]
dependencies = [
    "pandas>=2.1",
    "pyarrow>=14",
    "requests>=2.31",
    "typer>=0.12",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
winprob = ["torch>=2.3", "scikit-learn>=1.6", "matplotlib>=3.8", "joblib>=1.3"]
synthetic = ["torch>=2.3", "scikit-learn>=1.6", "matplotlib>=3.8", "joblib>=1.3", "scipy>=1.11"]
ctgan = ["ctgan>=0.10"]
rag = ["duckdb>=1.0", "scikit-learn>=1.6", "scipy>=1.11", "langchain-core>=0.3"]
embeddings = ["sentence-transformers>=3", "pillow>=10"]
ollama = ["langchain-ollama>=0.2"]
anthropic = ["langchain-anthropic>=0.3"]
openai = ["langchain-openai>=0.2"]
# Later modules add their own extras as they are built:
# vision = ["ultralytics>=8.2", "opencv-python-headless>=4.9"]
# agent = ["langgraph>=0.2", "langchain-core>=0.2"]

[project.scripts]
cricket-ai = "cricket_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cricket_ai"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/cricket_ai/cli.py" = ["B008"]  # typer uses calls in defaults by design

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
