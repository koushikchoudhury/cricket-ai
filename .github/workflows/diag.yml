name: diag-gan
on:
  push:
    branches: [synthetic]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[synthetic]"
      - run: python .github/diag/diag_gan.py
